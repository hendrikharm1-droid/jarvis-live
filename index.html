<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090d16">
  <title>JARVIS Live OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: radial-gradient(circle at 50% 30%, #172554 0%, #090d16 100%); color: #f8fafc; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; overflow: hidden; }
    .header { text-align: center; }
    .header h1 { font-size: 22px; letter-spacing: 2px; color: #38bdf8; text-transform: uppercase; }
    .orb-container { position: relative; display: flex; align-items: center; justify-content: center; }
    .orb { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, #38bdf8 10%, #2563eb 60%, #1e1b4b 100%); box-shadow: 0 0 50px rgba(56, 189, 248, 0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
    .orb.active { animation: pulse 1.4s infinite alternate ease-in-out; box-shadow: 0 0 90px rgba(56, 189, 248, 0.95); }
    @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.18); } }
    .log-box { width: 100%; height: 200px; background: rgba(0,0,0,0.6); border: 1px solid #334; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 10px; color: #888; overflow-y: auto; }
    .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .auth-box { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; }
    button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #38bdf8; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay" style="display: none;">
    <div class="auth-box">
      <h3>🔐 Token Eingabe</h3>
      <input type="password" id="tokenInput" placeholder="Sicherheitsschlüssel">
      <button onclick="saveAuthToken()">Start</button>
    </div>
  </div>

  <div class="header"><h1>JARVIS Live OS</h1></div>
  <div class="orb-container"><div class="orb" id="voiceOrb"><svg width="50" height="50" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></div></div>
  <div class="log-box" id="logBox">[System Bereit]</div>

  <script>
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyCSU3wEc2qwIoBsL3xtHT_TD58bSNja_wEm_QyWmiD2_yiWNOqBikAbxIia0M2S42TmA/exec";
    
    let dynamicApiKey = null;
    let authToken = localStorage.getItem("JARVIS_AUTH_TOKEN");
    let ws = null;
    let mediaStream = null;

    function log(msg) { const b = document.getElementById("logBox"); b.innerHTML += `<br>• ${msg}`; b.scrollTop = b.scrollHeight; }

    function callAppsScriptJSONP(action) {
      return new Promise((resolve) => {
        const cb = "cb_" + Date.now();
        window[cb] = (data) => { delete window[cb]; resolve(data); };
        const s = document.createElement("script");
        s.src = `${APPS_SCRIPT_WEBAPP_URL}?action=${action}&authToken=${authToken}&callback=${cb}`;
        document.body.appendChild(s);
      });
    }

    async function saveAuthToken() {
      authToken = document.getElementById("tokenInput").value.trim();
      localStorage.setItem("JARVIS_AUTH_TOKEN", authToken);
      document.getElementById("authOverlay").style.display = "none";
      log("✅ Token gesetzt.");
    }

    document.getElementById("voiceOrb").addEventListener("click", async () => {
      if (!authToken) { document.getElementById("authOverlay").style.display = "flex"; return; }
      
      log("Hole API-Key...");
      const res = await callAppsScriptJSONP("get_config");
      if (!res.apiKey) { log("❌ Fehler: " + JSON.stringify(res)); return; }
      dynamicApiKey = res.apiKey;

      log("🔍 Finde bestes Live-Modell...");
      const modelsRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${dynamicApiKey}`);
      const modelsData = await modelsRes.json();
      // Suche Modell das 'realtime' oder 'flash' enthält
      const model = modelsData.models.find(m => m.name.includes("gemini-2.0-flash-exp") || m.name.includes("gemini-2.0-flash-realtime-exp"))?.name.replace("models/", "") || "gemini-2.0-flash-exp";
      
      log(`🎯 Verbinde mit: ${model}`);
      
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${dynamicApiKey}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log("✅ WebSocket offen.");
        ws.send(JSON.stringify({
          setup: {
            model: model,
            generationConfig: { responseModalities: ["AUDIO"] }
          }
        }));
      };

      ws.onmessage = async (e) => {
        const d = JSON.parse(await e.data.text());
        if (d.setupComplete) log("🚀 Setup fertig. Sprich jetzt.");
        if (d.serverContent?.modelTurn?.parts) log("💬 Antwort erhalten.");
      };
      
      ws.onerror = (e) => log("❌ Fehler: " + e.type);
    });
  </script>
</body>
</html>
