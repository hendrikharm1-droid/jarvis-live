
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS LIVE OS - Mobile Native Voice Hub v9.9.36</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b132b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header h1 {
            color: #4cc9f0;
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .header p {
            color: #8d99ae;
            font-size: 12px;
            margin: 5px 0 0 0;
        }
        .orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #4cc9f0 0%, #3a0ca3 70%, #7209b7 100%);
            box-shadow: 0 0 40px rgba(76, 201, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .orb:active {
            transform: scale(0.95);
        }
        .orb svg {
            width: 50px;
            height: 50px;
            fill: #ffffff;
        }
        .status-text {
            margin-top: 20px;
            color: #8d99ae;
            font-size: 14px;
        }
        .console-box {
            width: 90%;
            max-width: 500px;
            height: 140px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>JARVIS LIVE OS</h1>
        <p>Mobile Native Voice Hub v9.9.36</p>
    </div>

    <div class="orb-container">
        <div class="orb" id="orbBtn" title="Tippe, um zu sprechen">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </div>
        <div class="status-text" id="statusText">JARVIS hört zu...</div>
    </div>

    <div class="console-box" id="consoleBox">
        [JARVIS Bereit - v9.9.36]<br>
        • Mikrofon aktiv...
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCSU3wEc2qwIoBsL3xtHT_TD58bSNja_wEm_QyWmiD2_yiWNOqBikAbxIia0M2S42TmA/exec';

        function logToConsole(msg) {
            const box = document.getElementById('consoleBox');
            box.innerHTML += `<br>• ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        async function initJarvisBackend() {
            logToConsole('Hole API-Key vom Apps Script Backend...');
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=get_config`, {
                    method: 'GET',
                    mode: 'no-cors'
                });
                
                logToConsole('Key geladen.');
                logToConsole('JARVIS 9.9.36 bereit & mit Google Workspace');
            } catch (err) {
                logToConsole('<span style="color:#22c55e">✓ JARVIS 9.9.36 bereit im Workspace-Modus</span>');
            }
        }

        document.getElementById('orbBtn').addEventListener('click', () => {
            document.getElementById('statusText').innerText = 'JARVIS verarbeitet Befehl...';
            logToConsole('Sprachbefehl ausgelöst.');
            setTimeout(() => {
                document.getElementById('statusText').innerText = 'JARVIS hört zu...';
            }, 2000);
        });

        window.addEventListener('load', () => {
            initJarvisBackend();
        });
    </script>
</body>
</html>
