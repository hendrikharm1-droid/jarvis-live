<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS LIVE OS - Mobile Native Voice Hub v9.9.36</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b132b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header h1 {
            color: #4cc9f0;
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .header p {
            color: #8d99ae;
            font-size: 12px;
            margin: 5px 0 0 0;
        }
        .orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #4cc9f0 0%, #3a0ca3 70%, #7209b7 100%);
            box-shadow: 0 0 40px rgba(76, 201, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .orb:active {
            transform: scale(0.95);
        }
        .orb.listening {
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.8);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .orb svg {
            width: 50px;
            height: 50px;
            fill: #ffffff;
        }
        .status-text {
            margin-top: 20px;
            color: #8d99ae;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }
        .console-box {
            width: 90%;
            max-width: 500px;
            height: 140px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>JARVIS LIVE OS</h1>
        <p>Mobile Native Voice Hub v9.9.36</p>
    </div>

    <div class="orb-container">
        <div class="orb" id="orbBtn" title="Tippe, um zu sprechen">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </div>
        <div class="status-text" id="statusText">Tippe auf den Orb, um mit Jarvis zu sprechen...</div>
    </div>

    <div class="console-box" id="consoleBox">
        [JARVIS Bereit - v9.9.36]<br>
        • Sprachmodul & Turbo-Index aktiv...
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCSU3wEc2qwIoBsL3xtHT_TD58bSNja_wEm_QyWmiD2_yiWNOqBikAbxIia0M2S42TmA/exec';

        function logToConsole(msg) {
            const box = document.getElementById('consoleBox');
            box.innerHTML += `<br>• ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        function speakJarvisResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 1.0;
                
                const voices = window.speechSynthesis.getVoices();
                const germanVoice = voices.find(v => v.lang.includes('de') || v.lang.includes('DE'));
                if (germanVoice) {
                    utterance.voice = germanVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        function callJarvisJSONP(action, paramsObj, callbackName) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                const paramStr = JSON.stringify(paramsObj || {});
                window[callbackName] = function(data) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    resolve(data);
                };
                script.onerror = function(err) {
                    delete window[callbackName];
                    if (script.parentNode) document.body.removeChild(script);
                    reject(err);
                };
                script.src = `${APPS_SCRIPT_URL}?action=${action}&params=${encodeURIComponent(paramStr)}&callback=${callbackName}`;
                document.body.appendChild(script);
            });
        }

        async function initJarvisBackend() {
            logToConsole('Verbinde mit Apps Script Backend...');
            try {
                const cbName = 'initCb_' + Math.random().toString(36).substring(7);
                const data = await callJarvisJSONP('get_config', {}, cbName);
                
                if (data && data.apiKey) {
                    logToConsole('Verbindung stabil & JSON-Turbo aktiv.');
                } else {
                    throw new Error('Antwort ohne API-Key');
                }
            } catch (err) {
                logToConsole('<span style="color:#ef4444">❌ Backend-Verbindung aktiv (JSONP-Modus)</span>');
            }
        }

        async function queryJarvisServer(userQuery) {
            document.getElementById('statusText').innerText = 'JARVIS verarbeitet Befehl...';
            logToConsole(`Frage: "${userQuery}"`);

            try {
                const cbName = 'searchCb_' + Math.random().toString(36).substring(7);
                const data = await callJarvisJSONP('search_documents', { query: userQuery }, cbName);
                
                const answer = data.output || "Ich habe keine Informationen dazu gefunden.";
                logToConsole(`Antwort erhalten.`);
                document.getElementById('statusText').innerText = answer.substring(0, 80) + '...';
                
                speakJarvisResponse(answer);
            } catch (err) {
                const fallbackMsg = "Entschuldigung, es gab ein Verbindungsproblem beim Durchsuchen des Indexes.";
                logToConsole('<span style="color:#ef4444">Fehler bei Abfrage</span>');
                speakJarvisResponse(fallbackMsg);
            } finally {
                setTimeout(() => {
                    document.getElementById('statusText').innerText = 'Tippe auf den Orb, um mit Jarvis zu sprechen...';
                }, 4000);
            }
        }

        const orbBtn = document.getElementById('orbBtn');
        orbBtn.addEventListener('click', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert('Dein Browser unterstützt keine Spracherkennung. Bitte nutze Chrome oder Safari.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                orbBtn.classList.add('listening');
                document.getElementById('statusText').innerText = 'JARVIS hört zu... Sprich jetzt!';
                logToConsole('Mikrofon aktiv, lausche...');
            };

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                logToConsole(`Erkannt: "${speechResult}"`);
                queryJarvisServer(speechResult);
            };

            recognition.onerror = (event) => {
                logToConsole(`<span style="color:#ef4444">Sprachfehler: ${event.error}</span>`);
                document.getElementById('statusText').innerText = 'Fehler bei der Spracherkennung.';
                orbBtn.classList.remove('listening');
            };

            recognition.onend = () => {
                orbBtn.classList.remove('listening');
            };

            recognition.start();
        });

        window.addEventListener('load', () => {
            initJarvisBackend();
        });
    </script>
</body>
</html>
