<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <title>JARVIS Live OS v9.9.32</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #172554 0%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
      overflow: hidden;
    }
    .header { text-align: center; }
    .header h1 { font-size: 22px; letter-spacing: 2px; color: #38bdf8; text-transform: uppercase; }
    .header p { font-size: 13px; color: #64748b; margin-top: 4px; }
    
    .orb-container { position: relative; display: flex; align-items: center; justify-content: center; }
    .orb {
      width: 160px; height: 160px; border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 10%, #2563eb 60%, #1e1b4b 100%);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.4);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease; -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .orb svg { width: 50px; height: 50px; fill: white; pointer-events: none; }
    .orb.active { animation: pulse 1.4s infinite alternate ease-in-out; box-shadow: 0 0 90px rgba(56, 189, 248, 0.95); }
    @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.18); filter: brightness(1.2); } }

    .status-box { text-align: center; font-size: 15px; color: #94a3b8; min-height: 24px; }
    .log-box {
      width: 100%; height: 160px; background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px); border: 1px solid #1e293b; border-radius: 12px;
      padding: 12px; font-family: monospace; font-size: 11px; color: #94a3b8; overflow-y: auto;
    }

    .auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .auth-box {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 25px; width: 100%; max-width: 340px; text-align: center;
    }
    .auth-box input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; text-align: center;
    }
    .auth-box button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay" style="display: none;">
    <div class="auth-box">
      <h3>🔐 JARVIS Security Gate</h3>
      <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Sicherheitsschlüssel eingeben:</p>
      <input type="password" id="tokenInput" placeholder="Passwort / PIN">
      <button onclick="saveAuthToken()">Entsperren</button>
    </div>
  </div>

  <div class="header">
    <h1>JARVIS Live OS</h1>
    <p>Natural Voice & Active Learning RAG Hub</p>
  </div>

  <div class="orb-container">
    <div class="orb" id="voiceOrb">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </div>
  </div>

  <div class="status-box" id="statusText">Tippe auf den Orb, um zu sprechen</div>
  <div class="log-box" id="logBox">[JARVIS Bereit]</div>

  <script>
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyCSU3wEc2qwIoBsL3xtHT_TD58bSNja_wEm_QyWmiD2_yiWNOqBikAbxIia0M2S42TmA/exec";
    const TARGET_MODEL = "models/gemini-2.5-flash-native-audio-latest";

    let dynamicApiKey = null;
    let isConnected = false;
    let isHandshakeReady = false;
    let ws = null;
    let audioContext = null;
    let inputContext = null;
    let mediaStream = null;
    let scriptProcessor = null;
    let nextPlayTime = 0;
    let authToken = localStorage.getItem("JARVIS_AUTH_TOKEN") || localStorage.getItem("JARVIS_WEBAPP_SECRET") || "";

    // State für Active Learning & Multi-Agenten-Suche
    let lastSearchContext = {
      primaryFileId: null,
      backupFileId: null,
      lastQuery: null
    };

    const orb = document.getElementById("voiceOrb");
    const statusText = document.getElementById("statusText");

    function log(msg) {
      const b = document.getElementById("logBox");
      b.innerHTML += `<br>• ${msg}`;
      b.scrollTop = b.scrollHeight;
    }

    function callAppsScriptJSONP(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = "jarvis_cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          
          // Wenn es sich um eine Dokumentensuche handelt, IDs für Active Learning zwischenspeichern
          if (action === 'search_documents' && typeof data === 'string') {
            extractSearchMetadata(data, params.query);
          }
          
          resolve(data);
        };

        const script = document.createElement("script");
        const queryParams = new URLSearchParams({
          action: action,
          authToken: authToken,
          callback: callbackName,
          params: JSON.stringify(params)
        });

        script.src = `${APPS_SCRIPT_WEBAPP_URL}?${queryParams.toString()}`;
        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error("Netzwerkfehler Backend"));
        };
        document.body.appendChild(script);
      });
    }

    // Hilfsfunktion zum Extrahieren von Datei-IDs für das Feedback-System
    function extractSearchMetadata(responseString, query) {
      lastSearchContext.lastQuery = query;
      const primaryMatch = responseString.match(/Primärer Treffer \(ID: ([^)]+)\)/);
      const backupMatch = responseString.match(/Alternativ-Kandidat \(ID: ([^)]+)\)/);
      
      lastSearchContext.primaryFileId = primaryMatch ? primaryMatch[1] : null;
      lastSearchContext.backupFileId = backupMatch ? backupMatch[1] : null;
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (!authToken) {
        document.getElementById("authOverlay").style.display = "flex";
      }
    });

    function saveAuthToken() {
      const val = document.getElementById("tokenInput").value.trim();
      if (val) {
        localStorage.setItem("JARVIS_AUTH_TOKEN", val);
        localStorage.setItem("JARVIS_WEBAPP_SECRET", val);
        authToken = val;
        document.getElementById("authOverlay").style.display = "none";
        log("✅ Schlüssel gespeichert.");
      }
    }

    orb.addEventListener("click", handleOrbClick);

    async function handleOrbClick() {
      if (!authToken) {
        document.getElementById("authOverlay").style.display = "flex";
        return;
      }
      if (isConnected) {
        stopSession();
      } else {
        await startSession();
      }
    }

    async function startSession() {
      orb.classList.add("active");
      statusText.innerText = "Initialisiere Hardware...";
      isHandshakeReady = false;

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        nextPlayTime = audioContext.currentTime;

        log("🎙️ Mikrofon aktiv.");

        if (!dynamicApiKey) {
          statusText.innerText = "Lade Konfiguration...";
          log("Hole API-Key vom Apps Script Backend...");
          const res = await callAppsScriptJSONP("get_config");

          if (!res || !res.apiKey) {
            log("🚨 Konfigurationsfehler: " + (res?.error || "Kein API-Key"));
            stopSession();
            return;
          }
          dynamicApiKey = res.apiKey.trim();
          log("🔑 Key geladen.");
        }

        statusText.innerText = "Verbinde mit Gemini Live...";
        connectWebSocket();
      } catch (err) {
        log("❌ Fehler: " + err.message);
        stopSession();
      }
    }

    function connectWebSocket() {
      log(`Öffne Live-WebSocket (${TARGET_MODEL})...`);
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${dynamicApiKey}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log("✅ WebSocket offen. Sende Setup mit Tools...");
        statusText.innerText = "Synchronisiere Setup...";

        const TODAY_ISO = new Date().toISOString().split("T")[0];
        const setupMessage = {
          setup: {
            model: TARGET_MODEL,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: "Puck" }
                }
              }
            },
            systemInstruction: {
              parts: [{ 
                text: `Du bist JARVIS, der hochentwickelte persönliche KI-Assistent von Hendrik Harm.
HEUTIGES DATUM: ${TODAY_ISO}.
STRIKTE SPRECHREGELN: 
- Lies niemals Dateinamen, IDs oder Unterstriche mechanisch vor! Übersetze technische Dateinamen beim Sprechen immer in natürliche deutsche Sätze (z.B. "Die Vattenfall Stromrechnung vom 5. März").
- Antworte absolut menschlich, flüssig, präzise und direkt auf Deutsch.
- Nutze aktiv deine Tools, wenn Hendrik nach E-Mails, Terminen, Aufgaben oder Dokumenten fragt.
- AKTIVES LERNEN: Wenn Hendrik dir bestätigt, dass ein gefundenes Dokument das richtige war, nutze das Tool "train_search", um den Suchbegriff für die Zukunft abzuspeichern.` 
              }]
            },
            tools: [{
              functionDeclarations: [
                {
                  name: "create_draft_with_attachment",
                  description: "Erstellt einen echten E-Mail-Entwurf im Gmail-Postfach von Hendrik Harm.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      recipient: { type: "STRING", description: "Empfänger-Adresse" },
                      subject: { type: "STRING", description: "Betreff" },
                      body: { type: "STRING", description: "Inhalt" },
                      fileId: { type: "STRING", description: "Optional: Datei-ID für Anhang" }
                    },
                    required: ["subject", "body"]
                  }
                },
                {
                  name: "get_recent_emails",
                  description: "Ruft ungelesene oder aktuelle E-Mails aus dem Posteingang von Hendrik Harm ab.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      limit: { type: "NUMBER", description: "Anzahl (Standard: 5)" }
                    }
                  }
                },
                {
                  name: "search_documents",
                  description: "Durchsucht den Drive Index (inklusive Primär- und Backup-Kandidat) und führt ein Deep-Reading im Vektor-Inhalt aus.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      query: { type: "STRING", description: "Suchbegriff oder inhaltliche Frage" }
                    },
                    required: ["query"]
                  }
                },
                {
                  name: "train_search",
                  description: "Speichert einen erfolgreichen Suchbegriff dauerhaft als Synonym für die gefundene Datei ab, um künftige Suchen zu verbessern.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      fileId: { type: "STRING", description: "Die Datei-ID (nutze standardmäßig die ID aus dem letzten Suchergebnis oder Backup)" },
                      query: { type: "STRING", description: "Der vom Nutzer verwendete Suchbegriff" }
                    },
                    required: ["fileId", "query"]
                  }
                },
                {
                  name: "get_upcoming_deadlines",
                  description: "Ruft anstehende Kalendertermine und Fristen ab.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      days: { type: "NUMBER", description: "Tage im Voraus" }
                    }
                  }
                },
                {
                  name: "get_open_tasks",
                  description: "Ruft offene Aufgaben aus der Google Tasks Liste ab.",
                  parameters: { type: "OBJECT", properties: {} }
                },
                {
                  name: "create_task",
                  description: "Erstellt eine neue Aufgabe in Google Tasks.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      title: { type: "STRING", description: "Aufgabentitel" },
                      notes: { type: "STRING", description: "Notizen/Details" },
                      dueDaysOffset: { type: "NUMBER", description: "Fällig in X Tagen" }
                    },
                    required: ["title"]
                  }
                }
              ]
            }]
          }
        };

        ws.send(JSON.stringify(setupMessage));
      };

      ws.onmessage = async (event) => {
        try {
          let textData = event.data;
          if (event.data instanceof Blob) {
            textData = await event.data.text();
          }
          const res = JSON.parse(textData);

          if (res.error) {
            log(`🚨 Google-Fehler: ${res.error.message || JSON.stringify(res.error)}`);
            return;
          }

          if (res.setupComplete) {
            log("🎯 JARVIS Live & Workspace gekoppelt!");
            statusText.innerText = "JARVIS hört zu...";
            isConnected = true;
            isHandshakeReady = true;
            startAudioStreaming();
            return;
          }

          if (res.toolCall) {
            const calls = res.toolCall.functionCalls || [];
            const responses = [];
            for (let c of calls) {
              log(`⚡ Tool aktiv: <b>${c.name}</b>`);
              try {
                // Falls das 'train_search' Tool aufgerufen wird, übergeben wir automatisch die gemerkten Context-IDs falls leer
                let callArgs = c.args || {};
                if (c.name === 'train_search') {
                  if (!callArgs.fileId && lastSearchContext.primaryFileId) {
                    callArgs.fileId = lastSearchContext.primaryFileId;
                  }
                  if (!callArgs.query && lastSearchContext.lastQuery) {
                    callArgs.query = lastSearchContext.lastQuery;
                  }
                }

                const out = await callAppsScriptJSONP(c.name, callArgs);
                log(`📥 Daten geladen für ${c.name}`);
                responses.push({ name: c.name, id: c.id, response: { output: out } });
              } catch (err) {
                log(`❌ Tool-Fehler: ${err.message}`);
                responses.push({ name: c.name, id: c.id, response: { error: err.message } });
              }
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
            }
          }

          if (res.serverContent?.modelTurn?.parts) {
            for (let p of res.serverContent.modelTurn.parts) {
              if (p.inlineData && p.inlineData.mimeType?.startsWith("audio/pcm")) {
                playPcmChunkSmooth(p.inlineData.data);
              }
            }
          }
        } catch (e) {
          log("⚠️ Nachricht: " + e.message);
        }
      };

      ws.onerror = (e) => log("❌ WebSocket Verbindungsfehler");
      ws.onclose = (e) => {
        log(`Sitzung beendet (${e.code}).`);
        stopSession();
      };
    }

    function startAudioStreaming() {
      inputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (inputContext.state === 'suspended') inputContext.resume();

      const source = inputContext.createMediaStreamSource(mediaStream);
      scriptProcessor = inputContext.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!isConnected || !isHandshakeReady || !ws || ws.readyState !== WebSocket.OPEN) return;
        const input = e.inputBuffer.getChannelData(0);
        const pcm16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
        }
        const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
        ws.send(JSON.stringify({
          realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Audio }] }
        }));
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(inputContext.destination);
      log("🎙️ Live Audio Stream aktiv.");
    }

    function playPcmChunkSmooth(base64Data) {
      if (!audioContext) return;
      if (audioContext.state === 'suspended') audioContext.resume();

      const binaryString = atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const pcm16 = new Int16Array(bytes.buffer);
      const audioBuffer = audioContext.createBuffer(1, pcm16.length, 24000);
      const channelData = audioBuffer.getChannelData(0);

      for (let i = 0; i < pcm16.length; i++) {
        channelData[i] = pcm16[i] / 32768.0;
      }

      const sourceNode = audioContext.createBufferSource();
      sourceNode.buffer = audioBuffer;
      sourceNode.connect(audioContext.destination);

      const currentTime = audioContext.currentTime;
      if (nextPlayTime < currentTime) {
        nextPlayTime = currentTime + 0.02;
      }
      sourceNode.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
    }

    function stopSession() {
      isConnected = false;
      isHandshakeReady = false;
      if (ws) { try { ws.close(); } catch(e){} ws = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (scriptProcessor) { try { scriptProcessor.disconnect(); } catch(e){} scriptProcessor = null; }
      if (inputContext && inputContext.state !== 'closed') { try { inputContext.close(); } catch(e){} inputContext = null; }
      if (audioContext && audioContext.state !== 'closed') { try { audioContext.close(); } catch(e){} audioContext = null; }
      nextPlayTime = 0;
      orb.classList.remove("active");
      statusText.innerText = "Tippe auf den Orb, um zu sprechen";
    }
  </script>
</body>
</html>
