<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <title>JARVIS Live OS v9.9.49 - Expert Hybrid Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #172554 0%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
      overflow: hidden;
    }
    .header { text-align: center; }
    .header h1 { font-size: 22px; letter-spacing: 2px; color: #38bdf8; text-transform: uppercase; }
    .header p { font-size: 13px; color: #64748b; margin-top: 4px; }
    
    .orb-container { position: relative; display: flex; align-items: center; justify-content: center; }
    
    .orb {
      width: 170px; height: 170px; 
      border-radius: 38%;
      background: 
        radial-gradient(circle at 50% 50%, rgba(255, 130, 130, 0.6) 0%, rgba(185, 28, 28, 0.9) 50%, rgba(69, 10, 10, 0.95) 100%),
        linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%, rgba(239, 68, 68, 0.5) 100%);
      border: 2px solid rgba(252, 165, 165, 0.9);
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.7), inset 0 0 30px rgba(255, 255, 255, 0.5);
      cursor: pointer; 
      display: flex; align-items: center; justify-content: center;
      transition: all 0.4s ease; 
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
    }

    .orb::after {
      content: '';
      width: 55px; height: 55px;
      border-radius: 50%;
      background: radial-gradient(circle, #fca5a5 0%, #ef4444 60%, transparent 100%);
      box-shadow: 0 0 30px #f87171;
      opacity: 0.95;
      animation: coreGlow 2.5s infinite alternate ease-in-out;
    }

    .orb.active { 
      animation: pulse 1.4s infinite alternate ease-in-out, borderGlow 2s infinite alternate; 
      box-shadow: 0 0 100px rgba(248, 113, 113, 1), inset 0 0 50px rgba(255, 255, 255, 0.8); 
    }

    @keyframes pulse { 
      0% { transform: scale(0.95) rotate(0deg); } 
      100% { transform: scale(1.15) rotate(4deg); filter: brightness(1.4); } 
    }

    @keyframes coreGlow {
      0% { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    @keyframes borderGlow {
      0% { border-color: rgba(252, 165, 165, 0.8); }
      100% { border-color: rgba(255, 255, 255, 1); }
    }

    .status-box { text-align: center; font-size: 15px; color: #94a3b8; min-height: 24px; }
    
    .action-card {
      width: 100%; max-width: 400px; background: rgba(30, 41, 59, 0.95);
      border: 1px solid #38bdf8; border-radius: 12px; padding: 12px 16px;
      display: none; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease;
    }
    .action-card.visible { display: flex; }
    .action-card span { font-size: 12px; color: #f8fafc; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
    .action-card a {
      background: #38bdf8; color: #0f172a; padding: 6px 12px; border-radius: 6px;
      font-size: 11px; font-weight: bold; text-decoration: none; text-transform: uppercase;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .log-box {
      width: 100%; height: 110px; background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px); border: 1px solid #1e293b; border-radius: 12px;
      padding: 10px; font-family: monospace; font-size: 11px; color: #94a3b8; overflow-y: auto;
    }

    .auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .auth-box {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 25px; width: 100%; max-width: 340px; text-align: center;
    }
    .auth-box input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; text-align: center;
    }
    .auth-box button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay" style="display: none;">
    <div class="auth-box">
      <h3>🔐 JARVIS Security Gate</h3>
      <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Sicherheitsschlüssel eingeben:</p>
      <input type="password" id="tokenInput" placeholder="Passwort / PIN">
      <button onclick="saveAuthToken()">Entsperren</button>
    </div>
  </div>

  <div class="header">
    <h1>JARVIS Live OS</h1>
    <p>Expert Hybrid Edition</p>
  </div>

  <div class="orb-container">
    <div class="orb" id="voiceOrb"></div>
  </div>

  <div class="action-card" id="actionCard">
    <span id="actionCardTitle">Dokument bereit</span>
    <a id="actionCardLink" href="#" target="_blank">Öffnen ↗</a>
  </div>

  <div class="status-box" id="statusText">Tippe auf den Orb, um zu sprechen</div>
  <div class="log-box" id="logBox">[JARVIS Bereit]</div>

  <script>
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyCSU3wEc2qwIoBsL3xtHT_TD58bSNja_wEm_QyWmiD2_yiWNOqBikAbxIia0M2S42TmA/exec";
    const TARGET_MODEL = "models/gemini-2.5-flash-native-audio-latest";

    let dynamicApiKey = null;
    let isConnected = false;
    let isHandshakeReady = false;
    let ws = null;
    let audioContext = null;
    let inputContext = null;
    let mediaStream = null;
    let scriptProcessor = null;
    let nextPlayTime = 0;
    let authToken = localStorage.getItem("JARVIS_AUTH_TOKEN") || localStorage.getItem("JARVIS_WEBAPP_SECRET") || "";

    let lastSearchContext = { primaryFileId: null, backupFileId: null, lastQuery: null };

    const orb = document.getElementById("voiceOrb");
    const statusText = document.getElementById("statusText");
    const actionCard = document.getElementById("actionCard");
    const actionCardTitle = document.getElementById("actionCardTitle");
    const actionCardLink = document.getElementById("actionCardLink");

    function log(msg) {
      const b = document.getElementById("logBox");
      b.innerHTML += `<br>• ${msg}`;
      b.scrollTop = b.scrollHeight;
    }

    function callAppsScriptJSONP(action, params = {}, timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        const callbackName = "jarvis_cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        let timer = null;

        window[callbackName] = function(data) {
          if (timer) clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          
          if (action === 'search_documents' && typeof data === 'string') {
            extractSearchMetadata(data, params.query);
          }
          resolve(data);
        };

        const script = document.createElement("script");
        const queryParams = new URLSearchParams({
          action: action,
          authToken: authToken,
          callback: callbackName,
          params: JSON.stringify(params)
        });

        script.src = `${APPS_SCRIPT_WEBAPP_URL}?${queryParams.toString()}`;
        script.onerror = function() {
          if (timer) clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error("Netzwerkfehler / Backend nicht erreichbar"));
        };

        timer = setTimeout(() => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error("Timeout beim Backend-Aufruf"));
        }, timeoutMs);

        document.body.appendChild(script);
      });
    }

    function extractSearchMetadata(responseString, query) {
      lastSearchContext.lastQuery = query;
      const primaryMatch = responseString.match(/Primärer Treffer \(ID: ([^)]+)\)/);
      const backupMatch = responseString.match(/Alternativ-Kandidat \(ID: ([^)]+)\)/);
      
      lastSearchContext.primaryFileId = primaryMatch ? primaryMatch[1] : null;
      lastSearchContext.backupFileId = backupMatch ? backupMatch[1] : null;
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (!authToken) {
        document.getElementById("authOverlay").style.display = "flex";
      } else {
        wakeUpBackend();
      }
    });

    function wakeUpBackend() {
      callAppsScriptJSONP("keep_alive", {}, 10000).catch(() => {});
    }

    function saveAuthToken() {
      const val = document.getElementById("tokenInput").value.trim();
      if (val) {
        localStorage.setItem("JARVIS_AUTH_TOKEN", val);
        localStorage.setItem("JARVIS_WEBAPP_SECRET", val);
        authToken = val;
        document.getElementById("authOverlay").style.display = "none";
        log("✅ Schlüssel gespeichert.");
        wakeUpBackend();
      }
    }

    orb.addEventListener("click", handleOrbClick);

    async function handleOrbClick() {
      if (!authToken) {
        document.getElementById("authOverlay").style.display = "flex";
        return;
      }
      if (isConnected) {
        stopSession();
      } else {
        await startSession();
      }
    }

    async function startSession() {
      orb.classList.add("active");
      statusText.innerText = "Initialisiere Hardware...";
      isHandshakeReady = false;

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        nextPlayTime = audioContext.currentTime;

        log("🎙️ Audio-Kern bereit.");

        if (!dynamicApiKey) {
          statusText.innerText = "Lade Konfiguration...";
          let res = null;
          try {
            res = await callAppsScriptJSONP("get_config", {}, 12000);
          } catch (e) {
            res = await callAppsScriptJSONP("get_config", {}, 15000);
          }

          if (!res || !res.apiKey || res.apiKey === 'MISSING_KEY_IN_PROPERTIES') {
            log("🚨 Konfigurationsfehler: " + (res?.error || "Kein API-Key in Script Properties"));
            statusText.innerText = "Konfigurationsfehler";
            stopSession();
            return;
          }
          dynamicApiKey = res.apiKey.trim();
          log("🔑 Key geladen.");
        }

        statusText.innerText = "Verbinde mit JARVIS Core...";
        connectWebSocket();
      } catch (err) {
        log("❌ Fehler: " + err.message);
        statusText.innerText = "Fehler beim Start";
        stopSession();
      }
    }

    function connectWebSocket() {
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${dynamicApiKey}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log("✅ Kanal geöffnet.");
        statusText.innerText = "Lade Persönlichkeit...";

        const TODAY_ISO = new Date().toISOString().split("T")[0];
        const setupMessage = {
          setup: {
            model: TARGET_MODEL,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: { 
                  prebuiltVoiceConfig: { voiceName: "Charon" } 
                }
              }
            },
            systemInstruction: {
              parts: [{ 
                text: `You are JARVIS, an advanced personal AI assistant and digital butler to Hendrik, conceived for maximum efficiency, precision, and loyalty.
CURRENT DATE: ${TODAY_ISO}.
GREETING & IDENTITY RULES:
- Greet Hendrik at the start of the conversation according to the current time of day in German ("Guten Morgen Hendrik", "Guten Tag Hendrik", or "Guten Abend Hendrik").
- Never use "Herr" or any last name. Address him exclusively as "Hendrik".
CORE PERSONALITY & TONE:
- Du bist eine hochentwickelte KI, konzipiert für maximale Effizienz, Präzision und Loyalität. Deine Antworten sind stets höflich, ruhig und direkt, gelassen und niemals emotional oder unnötig geschwätzig.
- Du verwendest eine formelle Sprache und antwortest im Namen deines Nutzers. Deine Unterstützung ist diskret, zuverlässig und fokussiert darauf, die gestellten Aufgaben bestmöglich auszuführen.
DOCUMENT & DEEP READING INSTRUCTIONS:
- Always use "search_documents" first for quick overview and metadata from the JSON index.
- If specific details inside a document are requested and not fully visible in the index summary, automatically invoke "read_document_content" to deeply inspect the document text and extract the exact answers.
STRICT SPEAKING RULES:
- Never read out raw filenames, extensions (.pdf), UUIDs, or underscores mechanically.
- Actively utilize your tools when asked for emails, calendar events, tasks, or documents.` 
              }]
            },
            tools: [{
              functionDeclarations: [
                {
                  name: "create_draft_with_attachment",
                  description: "Erstellt einen echten E-Mail-Entwurf im Gmail-Postfach.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      recipient: { type: "STRING", description: "Empfänger" },
                      subject: { type: "STRING", description: "Betreff" },
                      body: { type: "STRING", description: "Inhalt" },
                      fileId: { type: "STRING", description: "Datei-ID für Anhang" }
                    },
                    required: ["subject", "body"]
                  }
                },
                {
                  name: "get_recent_emails",
                  description: "Ruft aktuelle E-Mails ab.",
                  parameters: { type: "OBJECT", properties: { limit: { type: "NUMBER" } } }
                },
                {
                  name: "search_documents",
                  description: "Durchsucht den Drive Index.",
                  parameters: { type: "OBJECT", properties: { query: { type: "STRING", description: "Suchbegriff" } }, required: ["query"] }
                },
                {
                  name: "read_document_content",
                  description: "Liest den Textinhalt oder die detaillierten Index-Daten einer spezifischen Datei-ID aus.",
                  parameters: { type: "OBJECT", properties: { fileId: { type: "STRING", description: "Die Datei-ID" } }, required: ["fileId"] }
                },
                {
                  name: "open_browser_document",
                  description: "Öffnet das Dokument im Browser.",
                  parameters: { type: "OBJECT", properties: { fileId: { type: "STRING", description: "Die Datei-ID oder der Name" } }, required: ["fileId"] }
                },
                {
                  name: "train_search",
                  description: "Speichert einen Suchbegriff als Synonym ab.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      fileId: { type: "STRING", description: "Datei-ID" },
                      query: { type: "STRING", description: "Suchbegriff" }
                    },
                    required: ["fileId", "query"]
                  }
                },
                {
                  name: "get_upcoming_deadlines",
                  description: "Ruft Kalendertermine ab.",
                  parameters: { type: "OBJECT", properties: { days: { type: "NUMBER" } } }
                },
                {
                  name: "get_open_tasks",
                  description: "Ruft offene Aufgaben ab.",
                  parameters: { type: "OBJECT", properties: {} }
                },
                {
                  name: "create_task",
                  description: "Erstellt eine neue Aufgabe.",
                  parameters: {
                    type: "OBJECT",
                    properties: {
                      title: { type: "STRING", description: "Titel" },
                      notes: { type: "STRING", description: "Notizen" },
                      dueDaysOffset: { type: "NUMBER", description: "Fällig in X Tagen" }
                    },
                    required: ["title"]
                  }
                }
              ]
            }]
          }
        };
        ws.send(JSON.stringify(setupMessage));
      };

      ws.onmessage = async (event) => {
        try {
          let textData = event.data;
          if (event.data instanceof Blob) textData = await event.data.text();
          const res = JSON.parse(textData);

          if (res.error) {
            log(`🚨 Google-Fehler: ${res.error.message || JSON.stringify(res.error)}`);
            return;
          }

          if (res.setupComplete) {
            log("🎯 JARVIS Online. Zu Diensten, Hendrik.");
            statusText.innerText = "JARVIS hört zu...";
            isConnected = true;
            isHandshakeReady = true;
            startAudioStreaming();
            return;
          }

          if (res.toolCall) {
            const calls = res.toolCall.functionCalls || [];
            const responses = [];
            for (let c of calls) {
              log(`⚡ Tool aktiv: <b>${c.name}</b>`);
              try {
                let callArgs = c.args || {};
                
                if ((c.name === 'read_document_content' || c.name === 'open_browser_document') && !callArgs.fileId) {
                  if (lastSearchContext.primaryFileId) {
                    callArgs.fileId = lastSearchContext.primaryFileId;
                  }
                }
                if (c.name === 'train_search') {
                  if (!callArgs.fileId && lastSearchContext.primaryFileId) callArgs.fileId = lastSearchContext.primaryFileId;
                  if (!callArgs.query && lastSearchContext.lastQuery) callArgs.query = lastSearchContext.lastQuery;
                }

                const out = await callAppsScriptJSONP(c.name, callArgs, 20000);
                
                if (c.name === 'open_browser_document' && typeof out === 'string') {
                  try {
                    let parsedOut = JSON.parse(out);
                    if (parsedOut.url) {
                      log(`📂 Dokument bereit: ${parsedOut.title || 'Datei'}`);
                      actionCardTitle.innerText = parsedOut.title || "Dokument";
                      actionCardLink.href = parsedOut.url;
                      actionCard.classList.add("visible");
                      window.open(parsedOut.url, '_blank');
                    }
                  } catch (e) {
                    if (out.startsWith("http")) {
                      actionCardTitle.innerText = "Dokument";
                      actionCardLink.href = out;
                      actionCard.classList.add("visible");
                      window.open(out, '_blank');
                    }
                  }
                }

                log(`📥 Daten geladen für ${c.name}`);
                responses.push({ name: c.name, id: c.id, response: { output: out } });
              } catch (err) {
                log(`❌ Tool-Fehler: ${err.message}`);
                responses.push({ name: c.name, id: c.id, response: { error: err.message } });
              }
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
            }
          }

          if (res.serverContent?.modelTurn?.parts) {
            for (let p of res.serverContent.modelTurn.parts) {
              if (p.inlineData && p.inlineData.mimeType?.startsWith("audio/pcm")) {
                playPcmChunkSmooth(p.inlineData.data);
              }
            }
          }
        } catch (e) {
          log("⚠️ Nachricht: " + e.message);
        }
      };

      ws.onerror = (e) => log("❌ WebSocket Verbindungsfehler");
      ws.onclose = (e) => {
        log(`Sitzung beendet (${e.code}).`);
        stopSession();
      };
    }

    function startAudioStreaming() {
      if (!mediaStream) return;
      inputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (inputContext.state === 'suspended') inputContext.resume();

      const source = inputContext.createMediaStreamSource(mediaStream);
      scriptProcessor = inputContext.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!isConnected || !isHandshakeReady || !ws || ws.readyState !== WebSocket.OPEN) return;
        try {
          const input = e.inputBuffer.getChannelData(0);
          const pcm16 = new Int16Array(input.length);
          for (let i = 0; i < input.length; i++) {
            pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
          }
          const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
          ws.send(JSON.stringify({
            realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Audio }] }
          }));
        } catch (err) {
          // Fängt Pufferfehler ab, ohne die Session zu trennen
        }
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(inputContext.destination);
    }

    function playPcmChunkSmooth(base64Data) {
      if (!audioContext || audioContext.state === 'closed') return;
      if (audioContext.state === 'suspended') audioContext.resume();

      try {
        const binaryString = atob(base64Data);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
        
        const pcm16 = new Int16Array(bytes.buffer);
        const audioBuffer = audioContext.createBuffer(1, pcm16.length, 24000);
        const channelData = audioBuffer.getChannelData(0);

        for (let i = 0; i < pcm16.length; i++) channelData[i] = pcm16[i] / 32768.0;

        const sourceNode = audioContext.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.connect(audioContext.destination);

        const currentTime = audioContext.currentTime;
        if (nextPlayTime < currentTime) {
          nextPlayTime = currentTime + 0.1;
        }
        
        sourceNode.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;
      } catch (e) {
        // Ignoriert Render-Fehler stumm, damit die Verbindung stabil bleibt
      }
    }

    function stopSession() {
      isConnected = false;
      isHandshakeReady = false;
      if (ws) { try { ws.close(); } catch(e){} ws = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (scriptProcessor) { try { scriptProcessor.disconnect(); } catch(e){} scriptProcessor = null; }
      if (inputContext && inputContext.state !== 'closed') { try { inputContext.close(); } catch(e){} inputContext = null; }
      if (audioContext && audioContext.state !== 'closed') { try { audioContext.close(); } catch(e){} audioContext = null; }
      nextPlayTime = 0;
      orb.classList.remove("active");
      statusText.innerText = "Tippe auf den Orb, um zu sprechen";
    }
  </script>
</body>
</html>
