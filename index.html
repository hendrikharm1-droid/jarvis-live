<script>
  const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyCSU3wEc2qwIoBsL3xtHT_TD58bSNja_wEm_QyWmiD2_yiWNOqBikAbxIia0M2S42TmA/exec";
  const TARGET_MODEL = "models/gemini-2.5-flash-native-audio-latest";

  let dynamicApiKey = null;
  let isConnected = false;
  let isHandshakeReady = false;
  let ws = null;
  let audioContext = null;
  let inputContext = null;
  let mediaStream = null;
  let scriptProcessor = null;
  let nextPlayTime = 0;
  let authToken = localStorage.getItem("JARVIS_AUTH_TOKEN") || localStorage.getItem("JARVIS_WEBAPP_SECRET") || "";

  const orb = document.getElementById("voiceOrb");
  const statusText = document.getElementById("statusText");

  function log(msg) {
    const b = document.getElementById("logBox");
    b.innerHTML += `<br>• ${msg}`;
    b.scrollTop = b.scrollHeight;
  }

  function callAppsScriptJSONP(action, params = {}) {
    return new Promise((resolve, reject) => {
      const callbackName = "jarvis_cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(data);
      };

      const script = document.createElement("script");
      const queryParams = new URLSearchParams({
        action: action,
        authToken: authToken,
        callback: callbackName,
        params: JSON.stringify(params)
      });

      script.src = `${APPS_SCRIPT_WEBAPP_URL}?${queryParams.toString()}`;
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error("Netzwerkfehler Backend"));
      };
      document.body.appendChild(script);
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    if (!authToken) {
      document.getElementById("authOverlay").style.display = "flex";
    }
  });

  function saveAuthToken() {
    const val = document.getElementById("tokenInput").value.trim();
    if (val) {
      localStorage.setItem("JARVIS_AUTH_TOKEN", val);
      localStorage.setItem("JARVIS_WEBAPP_SECRET", val);
      authToken = val;
      document.getElementById("authOverlay").style.display = "none";
      log("✅ Schlüssel gespeichert.");
    }
  }

  orb.addEventListener("click", handleOrbClick);
  async function handleOrbClick() {
    if (!authToken) {
      document.getElementById("authOverlay").style.display = "flex";
      return;
    }
    if (isConnected) {
      stopSession();
    } else {
      await startSession();
    }
  }

  async function startSession() {
    orb.classList.add("active");
    statusText.innerText = "Initialisiere Hardware...";
    isHandshakeReady = false;

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
      });
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      nextPlayTime = audioContext.currentTime;

      log("🎙️ Mikrofon aktiv.");
      if (!dynamicApiKey) {
        statusText.innerText = "Lade Konfiguration...";
        log("Hole API-Key vom Apps Script Backend...");
        const res = await callAppsScriptJSONP("get_config");
        if (!res || !res.apiKey) {
          log("🚨 Konfigurationsfehler: " + (res?.error || "Kein API-Key"));
          stopSession();
          return;
        }
        dynamicApiKey = res.apiKey.trim();
        log("🔑 Key geladen.");
      }

      statusText.innerText = "Verbinde mit Gemini Live...";
      connectWebSocket();
    } catch (err) {
      log("❌ Fehler: " + err.message);
      stopSession();
    }
  }

  function connectWebSocket() {
    log(`Öffne Live-WebSocket (${TARGET_MODEL})...`);
    const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${dynamicApiKey}`;
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      log("✅ WebSocket offen. Sende Setup mit Tools...");
      statusText.innerText = "Synchronisiere Setup...";

      const TODAY_ISO = new Date().toISOString().split("T")[0];
      const setupMessage = {
        setup: {
          model: TARGET_MODEL,
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: "Aoede" }
              }
            }
          },
          systemInstruction: {
            parts: [{ 
              text: `Du bist JARVIS, der hochentwickelte persönliche KI-Assistent von Hendrik Harm.
HEUTIGES DATUM: ${TODAY_ISO}.
Du hast vollen Lese- und Schreibzugriff auf Google Mail, Google Drive, Google Kalender und Tabellen.
WICHTIGE ANWEISUNGEN:
1. Wenn Hendrik eine E-Mail erstellen oder vorbereiten möchte, rufe IMMER SOFORT das Tool 'create_draft_with_attachment' auf.
Sage niemals, dass du keine Mails erstellen kannst!
2. Wenn Hendrik nach Dokumenten sucht, nutze 'search_documents'.
3. Wenn Hendrik nach Terminen oder Fristen fragt, nutze 'get_upcoming_deadlines'.
4. Wenn Hendrik nach Mails fragt, nutze 'get_recent_emails'.
5. Antworte immer auf Deutsch per Sprache, freundlich, präzise und direkt.` 
            }]
          },
          tools: [{
            functionDeclarations: [
              {
                name: "create_draft_with_attachment",
                description: "Erstellt einen echten E-Mail-Entwurf im Gmail-Postfach von Hendrik Harm mit optionalem Drive-Anhang.",
                parameters: {
                  type: "OBJECT",
                  properties: {
                    recipient: { type: "STRING", description: "E-Mail-Adresse des Empfängers" },
                    subject: { type: "STRING", description: "Betreffzeile der E-Mail" },
                    body: { type: "STRING", description: "Inhalt/Text der E-Mail" },
                    fileId: { type: "STRING", description: "ID der zuvor gefundenen Drive-Datei für den Anhang" },
                    fileName: { type: "STRING", description: "Dateiname der anzuhängenden Datei" }
                  },
                  required: ["subject", "body"]
                }
              },
              {
                name: "get_recent_emails",
                description: "Ruft ungelesene E-Mails aus dem Gmail-Posteingang von Hendrik Harm ab.",
                parameters: {
                  type: "OBJECT",
                  properties: {
                    limit: { type: "NUMBER", description: "Anzahl der abzurufenden E-Mails (Standard: 5)" }
                  }
                }
              },
              {
                name: "search_documents",
                description: "Durchsucht die Google Drive Ablage und den Index nach Dokumenten, Verträgen, Rechnungen oder Belegen.",
                parameters: {
                  type: "OBJECT",
                  properties: {
                    query: { type: "STRING", description: "Der Suchbegriff" }
                  },
                  required: ["query"]
                }
              },
              {
                name: "get_upcoming_deadlines",
                description: "Ruft anstehende Kalendertermine und Fristen ab.",
                parameters: {
                  type: "OBJECT",
                  properties: {
                    days: { type: "NUMBER", description: "Anzahl Tage im Voraus (Standard: 7)" }
                  }
                }
              },
              {
                name: "get_tax_summary",
                description: "Ruft die erfassten Steuerdaten und Handwerkerlohn-Summen (§35a EStG) für 2026 ab.",
                parameters: {
                  type: "OBJECT",
                  properties: {
                    category: { type: "STRING", description: "Optionale Kategorie" }
                  }
                }
              },
              {
                name: "get_entity_relation",
                description: "Ruft Beziehungen, Verträge oder Stammdaten aus dem Knowledge Graph ab.",
                parameters: {
                  type: "OBJECT",
                  properties: {
                    entityName: { type: "STRING", description: "Name der Entität" }
                  },
                  required: ["entityName"]
                }
              }
            ]
          }]
        }
      };
      ws.send(JSON.stringify(setupMessage));
    };

    ws.onmessage = async (event) => {
      try {
        let textData = event.data;
        if (event.data instanceof Blob) {
          textData = await event.data.text();
        }
        const res = JSON.parse(textData);
        if (res.error) {
          log(`🚨 Google-Fehler: ${res.error.message || JSON.stringify(res.error)}`);
          return;
        }

        if (res.setupComplete) {
          log("🎯 JARVIS bereit & mit Google Workspace gekoppelt!");
          statusText.innerText = "JARVIS hört zu...";
          isConnected = true;
          isHandshakeReady = true;
          startAudioStreaming();
          return;
        }

        // Tool-Aufruf von Gemini abfangen
        if (res.toolCall) {
          const calls = res.toolCall.functionCalls || [];
          const responses = [];
          for (let c of calls) {
            log(`⚡ Tool aktiv: <b>${c.name}</b>`);
            try {
              const out = await callAppsScriptJSONP(c.name, c.args || {});
              log(`📥 Daten geladen für ${c.name}`);
              responses.push({ name: c.name, id: c.id, response: { output: out } });
            } catch (err) {
              log(`❌ Tool-Fehler: ${err.message}`);
              responses.push({ name: c.name, id: c.id, response: { error: err.message } });
            }
          }
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
          }
        }

        // Audio-Ausgabe (Streaming PCM)
        if (res.serverContent?.modelTurn?.parts) {
          for (let p of res.serverContent.modelTurn.parts) {
            if (p.inlineData && p.inlineData.mimeType?.startsWith("audio/pcm")) {
              playPcmChunkSmooth(p.inlineData.data);
            }
          }
        }
      } catch (e) {
        log("⚠️ Nachricht: " + e.message);
      }
    };

    ws.onerror = (e) => log("❌ WebSocket Verbindungsfehler");
    ws.onclose = (e) => {
      log(`Sitzung beendet (${e.code}).`);
      stopSession();
    };
  }

  function startAudioStreaming() {
    inputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    if (inputContext.state === 'suspended') inputContext.resume();

    const source = inputContext.createMediaStreamSource(mediaStream);
    scriptProcessor = inputContext.createScriptProcessor(4096, 1, 1);
    scriptProcessor.onaudioprocess = (e) => {
      if (!isConnected || !isHandshakeReady || !ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
      }
      const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
      ws.send(JSON.stringify({
        realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Audio }] }
      }));
    };

    source.connect(scriptProcessor);
    scriptProcessor.connect(inputContext.destination);
    log("🎙️ Live Audio Stream aktiv.");
  }

  // Präzises, knackfreies Audio-Stitching mit Web Audio API
  function playPcmChunkSmooth(base64Data) {
    if (!audioContext) return;
    if (audioContext.state === 'suspended') audioContext.resume();

    const binaryString = atob(base64Data);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    const pcm16 = new Int16Array(bytes.buffer);
    const audioBuffer = audioContext.createBuffer(1, pcm16.length, 24000);
    const channelData = audioBuffer.getChannelData(0);

    for (let i = 0; i < pcm16.length; i++) {
      channelData[i] = pcm16[i] / 32768.0;
    }

    const sourceNode = audioContext.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.connect(audioContext.destination);

    const currentTime = audioContext.currentTime;
    if (nextPlayTime < currentTime) {
      nextPlayTime = currentTime + 0.02; // Minimaler 20ms Sicherheits-Buffer gegen Jitter
    }
    sourceNode.start(nextPlayTime);
    nextPlayTime += audioBuffer.duration;
  }

  function stopSession() {
    isConnected = false;
    isHandshakeReady = false;
    if (ws) { try { ws.close(); } catch(e){} ws = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (scriptProcessor) { try { scriptProcessor.disconnect(); } catch(e){} scriptProcessor = null; }
    if (inputContext && inputContext.state !== 'closed') { try { inputContext.close(); } catch(e){} inputContext = null; }
    if (audioContext && audioContext.state !== 'closed') { try { audioContext.close(); } catch(e){} audioContext = null; }
    nextPlayTime = 0;
    orb.classList.remove("active");
    statusText.innerText = "Tippe auf den Orb, um zu sprechen";
  }
</script>
