<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <title>JARVIS Live OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #172554 0%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
      overflow: hidden;
    }
    .header { text-align: center; }
    .header h1 { font-size: 22px; letter-spacing: 2px; color: #38bdf8; text-transform: uppercase; }
    .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    
    .orb-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .orb {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle at 30% 30%, #38bdf8 0%, #0284c7 50%, #0f172a 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }
    .orb.active {
      box-shadow: 0 0 70px rgba(56, 189, 248, 0.8), inset 0 0 30px rgba(255, 255, 255, 0.8);
      transform: scale(1.05);
    }
    
    .status-panel {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .status-text { font-size: 14px; color: #38bdf8; margin-bottom: 8px; font-weight: 500; }
    .transcript { font-size: 13px; color: #cbd5e1; min-height: 40px; display: flex; align-items: center; justify-content: center; }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }
    button {
      flex: 1;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active { background: #0369a1; }
    button.secondary { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(56, 189, 248,.3); }
  </style>
</head>
<body>

  <div class="header">
    <h1>JARVIS OS</h1>
    <p>Multi-Agent & Vector RAG Connected</p>
  </div>

  <div class="orb-container" id="orbToggle">
    <div class="orb" id="orbElement"></div>
  </div>

  <div class="status-panel">
    <div class="status-text" id="statusText">System bereit. Tippe auf den Orb.</div>
    <div class="transcript" id="transcriptText">Bereit für Sprachbefehle oder RAG-Abfragen...</div>
  </div>

  <div class="controls">
    <button class="secondary" id="queryBtn">Vektor-Suche</button>
    <button id="connectBtn">Verbinden</button>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzQy42W9sQpE9sZ08lWllzWk...'; // Deine Web-App URL einsetzen
    let isConnected = false;
    let apiKey = '';

    document.getElementById('connectBtn').addEventListener('click', async () => {
      const status = document.getElementById('statusText');
      status.innerText = 'Lade Konfiguration...';
      try {
        const res = await fetch(`${SCRIPT_URL}?action=get_config`);
        const data = await res.json();
        if (data.apiKey) {
          apiKey = data.apiKey;
          isConnected = true;
          status.innerText = 'Verbunden mit Backend & Gemini.';
          document.getElementById('orbElement').classList.add('active');
        } else {
          status.innerText = 'Fehler: API-Key fehlt.';
        }
      } catch (err) {
        status.innerText = 'Verbindungsfehler zum Apps Script.';
      }
    });

    document.getElementById('queryBtn').addEventListener('click', async () => {
      const query = prompt("Was möchtest du im Vektor-Gedächtnis suchen?", "Rechnungen");
      if (!query) return;
      
      document.getElementById('statusText').innerText = 'Suche im Vektor-Memory...';
      try {
        const res = await fetch(`${SCRIPT_URL}?action=query_vector_memory&params=` + encodeURIComponent(JSON.stringify({ userQuery: query })));
        const data = await res.json();
        document.getElementById('transcriptText').innerText = data.output || data.error || 'Keine Antwort.';
        document.getElementById('statusText').innerText = 'Abfrage abgeschlossen.';
      } catch (err) {
        document.getElementById('statusText').innerText = 'Fehler bei der Abfrage.';
      }
    });

    document.getElementById('orbToggle').addEventListener('click', () => {
      const orb = document.getElementById('orbElement');
      orb.classList.toggle('active');
    });
  </script>
</body>
</html>
