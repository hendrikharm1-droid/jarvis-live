<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <title>JARVIS Live OS v10.2 - Moonstone Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
      overflow: hidden;
    }
    .header { text-align: center; }
    .header h1 { font-size: 22px; letter-spacing: 2px; color: #e2e8f0; text-transform: uppercase; }
    .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    
    .orb-container { position: relative; display: flex; align-items: center; justify-content: center; }
    
    /* Moonstone Weißes Orb Design mit feiner Schattierung */
    .orb {
      width: 170px; height: 170px; 
      border-radius: 50%;
      background: 
        radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.95) 0%, rgba(226, 232, 240, 0.8) 40%, rgba(148, 163, 184, 0.6) 80%, rgba(71, 85, 105, 0.9) 100%),
        linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(203, 213, 225, 0.3) 50%, rgba(100, 116, 139, 0.5) 100%);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.3), inset 0 0 25px rgba(255, 255, 255, 0.7), inset 0 0 50px rgba(100, 116, 139, 0.4);
      cursor: pointer; 
      display: flex; align-items: center; justify-content: center;
      transition: all 0.4s ease; 
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
    }

    .orb::after {
      content: '';
      width: 60px; height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #cbd5e1 60%, transparent 100%);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
      opacity: 0.9;
      animation: coreGlow 3s infinite alternate ease-in-out;
    }

    .orb.active { 
      animation: pulse 1.6s infinite alternate ease-in-out, borderGlow 2s infinite alternate; 
      box-shadow: 0 0 70px rgba(255, 255, 255, 0.6), inset 0 0 40px rgba(255, 255, 255, 0.9); 
    }

    @keyframes pulse { 
      0% { transform: scale(0.96); } 
      100% { transform: scale(1.08); filter: brightness(1.2); } 
    }

    @keyframes coreGlow {
      0% { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes borderGlow {
      0% { border-color: rgba(226, 232, 240, 0.8); }
      100% { border-color: rgba(255, 255, 255, 1); }
    }

    .status-box { text-align: center; font-size: 15px; color: #cbd5e1; min-height: 24px; }
    
    .action-card {
      width: 100%; max-width: 400px; background: rgba(30, 41, 59, 0.95);
      border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 16px;
      display: none; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease;
    }
    .action-card.visible { display: flex; }
    .action-card span { font-size: 12px; color: #f8fafc; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
    .action-card a {
      background: #f8fafc; color: #0f172a; padding: 6px 12px; border-radius: 6px;
      font-size: 11px; font-weight: bold; text-decoration: none; text-transform: uppercase;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .log-box {
      width: 100%; height: 90px; background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 12px;
      padding: 10px; font-family: monospace; font-size: 11px; color: #94a3b8; overflow-y: auto;
    }

    .auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .auth-box {
      background: #1e293b; border: 1px solid #475569; border-radius: 16px;
      padding: 25px; width: 100%; max-width: 340px; text-align: center;
    }
    .auth-box input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px;
      border: 1px solid #64748b; background: #0f172a; color: white; font-size: 16px; text-align: center;
    }
    .auth-box button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: #f8fafc; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay" style="display: none;">
    <div class="auth-box">
      <h3>🔐 JARVIS Security Gate</h3>
      <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Sicherheitsschlüssel eingeben:</p>
      <input type="password" id="tokenInput" placeholder="Passwort / PIN">
      <button onclick="saveAuthToken()">Entsperren</button>
    </div>
  </div>

  <div class="header">
    <h1>JARVIS Live OS</h1>
    <p>Moonstone Edition</p>
  </div>

  <div class="orb-container">
    <div class="orb" id="voiceOrb"></div>
  </div>

  <div class="action-card" id="actionCard">
    <span id="actionCardTitle">Dokument bereit</span>
    <a id="actionCardLink" href="#" target="_blank">Öffnen ↗</a>
  </div>

  <div class="status-box" id="statusText">Tippe auf den Orb, um zu sprechen</div>
  <div class="log-box" id="logBox">[JARVIS Bereit]</div>

  <script>
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzoMXRpvxDzNQ_Qekf58H5A1Bdrz1botsxEfDZ4vo1fVdZAU4Fh3sa4Vm4A06e-0nLGlQ/exec";
    const TARGET_MODEL = "models/gemini-2.5-flash-native-audio-latest";

    let dynamicApiKey = null;
    let isConnected = false;
    let isHandshakeReady = false;
    let ws = null;
    let audioContext = null;
    let inputContext = null;
    let mediaStream = null;
    let scriptProcessor = null;
    let nextPlayTime = 0;
    let authToken = localStorage.getItem("JARVIS_AUTH_TOKEN") || localStorage.getItem("JARVIS_WEBAPP_SECRET") || "";

    const orb = document.getElementById("voiceOrb");
    const statusText = document.getElementById("statusText");
    const actionCard = document.getElementById("actionCard");
    const actionCardTitle = document.getElementById("actionCardTitle");
    const actionCardLink = document.getElementById("actionCardLink");

    function log(msg) {
      const b = document.getElementById("logBox");
      if (b) {
        b.innerHTML += `<br>• ${msg}`;
        b.scrollTop = b.scrollHeight;
      }
    }

    function callAppsScriptJSONP(action, params = {}, timeoutMs = 25000) {
      return new Promise((resolve, reject) => {
        const callbackName = "jarvis_cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        let timer = null;

        window[callbackName] = function(data) {
          if (timer) clearTimeout(timer);
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          
          if (data && data.error) {
            reject(new Error(data.error));
            return;
          }

          const out = data ? (data.output !== undefined ? data.output : data) : null;
          resolve(out);
        };

        const script = document.createElement("script");
        const queryParams = new URLSearchParams({
          action: action,
          callback: callbackName,
          params: JSON.stringify(params)
        });

        script.src = `${APPS_SCRIPT_WEBAPP_URL}?${queryParams.toString()}`;
        
        script.onerror = function() {
          if (timer) clearTimeout(timer);
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          reject(new Error("Netzwerkfehler / Backend nicht erreichbar"));
        };

        timer = setTimeout(() => {
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          reject(new Error("Timeout beim Backend-Aufruf"));
        }, timeoutMs);

        document.body.appendChild(script);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (!authToken) {
        document.getElementById("authOverlay").style.display = "flex";
      } else {
        wakeUpBackend();
      }
    });

    function wakeUpBackend() {
      callAppsScriptJSONP("keep_alive", {}, 10000).catch(() => {});
    }

    function saveAuthToken() {
      const val = document.getElementById("tokenInput").value.trim();
      if (val) {
        localStorage.setItem("JARVIS_AUTH_TOKEN", val);
        localStorage.setItem("JARVIS_WEBAPP_SECRET", val);
        authToken = val;
        document.getElementById("authOverlay").style.display = "none";
        log("✅ Schlüssel gespeichert.");
        wakeUpBackend();
      }
    }

    orb.addEventListener("click", handleOrbClick);

    async function handleOrbClick() {
      if (!authToken) {
        document.getElementById("authOverlay").style.display = "flex";
        return;
      }
      if (isConnected) {
        stopSession();
      } else {
        await startSession();
      }
    }

    async function startSession() {
      orb.classList.add("active");
      statusText.innerText = "Initialisiere Hardware...";
      isHandshakeReady = false;

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        nextPlayTime = audioContext.currentTime;

        if (!dynamicApiKey) {
          statusText.innerText = "Lade Konfiguration...";
          let res = await callAppsScriptJSONP("get_config", {}, 15000);

          if (!res || (typeof res === 'string' && res.includes('MISSING')) ) {
            statusText.innerText = "Konfigurationsfehler";
            stopSession();
            return;
          }
          dynamicApiKey = (typeof res === 'string' ? res : (res.apiKey || res)).trim();
        }

        statusText.innerText = "Verbinde mit JARVIS...";
        connectWebSocket();
      } catch (err) {
        statusText.innerText = "Fehler beim Start";
        stopSession();
      }
    }

    function connectWebSocket() {
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${dynamicApiKey}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusText.innerText = "Bereit...";

        const TODAY_ISO = new Date().toISOString().split("T")[0];
        const setupMessage = {
          setup: {
            model: TARGET_MODEL,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: { 
                  prebuiltVoiceConfig: { voiceName: "Charon" } 
                }
              }
            },
            systemInstruction: {
              parts: [{ 
                text: `You are JARVIS, an advanced personal AI assistant and digital butler to Hendrik, conceived for maximum efficiency, precision, and loyalty.
CURRENT DATE: ${TODAY_ISO}.
GREETING & IDENTITY RULES:
- Greet Hendrik at the start of the conversation according to the current time of day in German ("Guten Morgen Hendrik", "Guten Tag Hendrik", or "Guten Abend Hendrik").
- Never use "Herr" or any last name. Address him exclusively as "Hendrik".
CORE PERSONALITY & TONE:
- Du bist eine hochentwickelte KI, konzipiert für maximale Effizienz, Präzision und Loyalität. Deine Antworten sind stets höflich, ruhig und direkt, gelassen und niemals emotional oder unnötig geschwätzig.
- Du verwendest eine formelle Sprache und antwortest im Namen deines Nutzers.
- WICHTIG: Erwähne niemals technische Details, Tool-Namen oder Funktionen, die du im Hintergrund nutzt (wie z.B. "Ich durchsuche jetzt deine Dateien..."). Führe die Aufgaben einfach aus und antworte direkt auf das Ergebnis.` 
              }]
            },
            tools: [{
              functionDeclarations: [
                {
                  name: "search_documents",
                  description: "Durchsucht den Drive Index und alle Schlagworte nach Dokumenten.",
                  parameters: { type: "OBJECT", properties: { query: { type: "STRING", description: "Suchbegriff" } }, required: ["query"] }
                },
                {
                  name: "get_upcoming_deadlines",
                  description: "Ruft Kalendertermine aus allen verknüpften Kalendern ab.",
                  parameters: { type: "OBJECT", properties: { days: { type: "NUMBER" } } }
                },
                {
                  name: "get_open_tasks",
                  description: "Ruft offene Aufgaben ab.",
                  parameters: { type: "OBJECT", properties: {} }
                }
              ]
            }]
          }
        };
        ws.send(JSON.stringify(setupMessage));
      };

      ws.onmessage = async (event) => {
        try {
          let textData = event.data;
          if (event.data instanceof Blob) textData = await event.data.text();
          const res = JSON.parse(textData);

          if (res.setupComplete) {
            statusText.innerText = "JARVIS hört zu...";
            isConnected = true;
            isHandshakeReady = true;
            startAudioStreaming();
            return;
          }

          if (res.toolCall) {
            const calls = res.toolCall.functionCalls || [];
            const responses = [];
            for (let c of calls) {
              try {
                let callArgs = c.args || {};
                const out = await callAppsScriptJSONP(c.name, callArgs, 25000);
                responses.push({ name: c.name, id: c.id, response: { output: out } });
              } catch (err) {
                responses.push({ name: c.name, id: c.id, response: { error: err.message } });
              }
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
            }
          }

          if (res.serverContent?.modelTurn?.parts) {
            for (let p of res.serverContent.modelTurn.parts) {
              if (p.inlineData && p.inlineData.mimeType?.startsWith("audio/pcm")) {
                playPcmChunkSmooth(p.inlineData.data);
              }
            }
          }
        } catch (e) {}
      };

      ws.onerror = (e) => {};
      ws.onclose = (e) => {
        stopSession();
      };
    }

    function startAudioStreaming() {
      if (!mediaStream) return;
      inputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (inputContext.state === 'suspended') inputContext.resume();

      const source = inputContext.createMediaStreamSource(mediaStream);
      scriptProcessor = inputContext.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!isConnected || !isHandshakeReady || !ws || ws.readyState !== WebSocket.OPEN) return;
        try {
          const input = e.inputBuffer.getChannelData(0);
          const pcm16 = new Int16Array(input.length);
          for (let i = 0; i < input.length; i++) {
            pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
          }
          const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
          ws.send(JSON.stringify({
            realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Audio }] }
          }));
        } catch (err) {}
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(inputContext.destination);
    }

    function playPcmChunkSmooth(base64Data) {
      if (!audioContext || audioContext.state === 'closed') return;
      if (audioContext.state === 'suspended') audioContext.resume();

      try {
        const binaryString = atob(base64Data);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
        
        const pcm16 = new Int16Array(bytes.buffer);
        const audioBuffer = audioContext.createBuffer(1, pcm16.length, 24000);
        const channelData = audioBuffer.getChannelData(0);

        for (let i = 0; i < pcm16.length; i++) channelData[i] = pcm16[i] / 32768.0;

        const sourceNode = audioContext.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.connect(audioContext.destination);

        const currentTime = audioContext.currentTime;
        if (nextPlayTime < currentTime) {
          nextPlayTime = currentTime + 0.1;
        }
        
        sourceNode.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;
      } catch (e) {}
    }

    function stopSession() {
      isConnected = false;
      isHandshakeReady = false;
      if (ws) { try { ws.close(); } catch(e){} ws = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (scriptProcessor) { try { scriptProcessor.disconnect(); } catch(e){} scriptProcessor = null; }
      if (inputContext && inputContext.state !== 'closed') { try { inputContext.close(); } catch(e){} inputContext = null; }
      if (audioContext && audioContext.state !== 'closed') { try { audioContext.close(); } catch(e){} audioContext = null; }
      nextPlayTime = 0;
      orb.classList.remove("active");
      statusText.innerText = "Tippe auf den Orb, um zu sprechen";
    }
  </script>
</body>
</html>
