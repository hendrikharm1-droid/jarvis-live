<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>JARVIS API Diagnose</title>
  <style>
    body { background: #0a0a0a; color: #00ff00; font-family: monospace; padding: 20px; font-size: 14px; }
    button { padding: 15px; background: #333; color: white; border: 1px solid #555; cursor: pointer; width: 100%; }
    #output { margin-top: 20px; white-space: pre-wrap; }
    .good { color: #00ff00; }
    .bad { color: #ff3333; }
  </style>
</head>
<body>
  <h1>JARVIS Diagnose-Tool</h1>
  <button onclick="runDiagnosis()">API & Modell Analyse starten</button>
  <div id="output">Warte auf Eingabe...</div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCSU3wEc2qwIoBsL3xtHT_TD58bSNja_wEm_QyWmiD2_yiWNOqBikAbxIia0M2S42TmA/exec";

    function log(msg, type = '') {
      document.getElementById('output').innerHTML += `<div class="${type}">${msg}</div>`;
    }

    async function runDiagnosis() {
      document.getElementById('output').innerHTML = "Starte Analyse...";
      const token = localStorage.getItem("JARVIS_AUTH_TOKEN");
      if(!token) { log("❌ Kein Auth-Token gefunden!", "bad"); return; }

      // 1. Key holen
      log("1. Hole API Key...");
      const res = await fetch(`${APPS_SCRIPT_URL}?action=get_config&authToken=${token}`);
      const data = await res.json();
      if(!data.apiKey) { log("❌ Backend lieferte keinen Key: " + JSON.stringify(data), "bad"); return; }
      log("✅ Key erhalten: " + data.apiKey.substring(0,6) + "...");

      // 2. Modelle auflisten
      log("2. Frage Google Modell-Liste ab...");
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${data.apiKey}`);
      const mData = await mRes.json();
      
      if(mData.error) { log("❌ Google Fehler: " + mData.error.message, "bad"); return; }

      log(`✅ Gefundene Modelle: ${mData.models.length}`);
      
      mData.models.forEach(m => {
        const supportsLive = m.supportedMethods.includes("BidiGenerateContent");
        const style = supportsLive ? "good" : "";
        const badge = supportsLive ? "[LIVE-READY!]" : "[Nur Text/Bild]";
        log(`${m.name} ${badge}`, style);
      });
      
      log("\n--- ANALYSE ENDE ---", "good");
      log("Schau in die Liste oben. Wenn ein Modell [LIVE-READY!] hat, nimm genau diesen Namen für das Setup-Feld!");
    }
  </script>
</body>
</html>
