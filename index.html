<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">
  <title>JARVIS Enterprise - Live Voice Assistant</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #c9d1d9;
      --accent-blue: #58a6ff;
      --accent-cyan: #39d353;
      --accent-red: #f85149;
      --orb-idle: radial-gradient(circle, #1f6feb 0%, #0d1117 70%);
      --orb-listening: radial-gradient(circle, #238636 0%, #0d1117 70%);
      --orb-speaking: radial-gradient(circle, #a371f7 0%, #0d1117 70%);
      --orb-tool: radial-gradient(circle, #d29922 0%, #0d1117 70%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-top: 10px;
    }

    header h1 {
      color: #f0f6fc;
      font-size: 1.6rem;
      letter-spacing: 2px;
    }

    header p {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 4px;
    }

    .orb-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
    }

    .orb {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--orb-idle);
      box-shadow: 0 0 35px rgba(31, 111, 235, 0.4);
      cursor: pointer;
      transition: all 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid rgba(255, 255, 255, 0.1);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .orb.listening {
      background: var(--orb-listening);
      box-shadow: 0 0 50px rgba(57, 211, 83, 0.6);
      transform: scale(1.05);
      animation: pulse 1.5s infinite alternate;
    }

    .orb.speaking {
      background: var(--orb-speaking);
      box-shadow: 0 0 60px rgba(163, 113, 247, 0.8);
      transform: scale(1.08);
      animation: pulse 0.8s infinite alternate;
    }

    .orb.tool {
      background: var(--orb-tool);
      box-shadow: 0 0 50px rgba(210, 153, 34, 0.8);
      transform: scale(1.03);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .orb-label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      pointer-events: none;
    }

    .status-panel {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #21262d;
      color: #8b949e;
    }

    .badge.online { background: #238636; color: #fff; }
    .badge.busy { background: #d29922; color: #fff; }
    .badge.offline { background: #da3633; color: #fff; }

    .log-box {
      width: 100%;
      height: 160px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      overflow-y: auto;
      color: #8b949e;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-entry { margin-bottom: 2px; }
    .log-info { color: #58a6ff; }
    .log-success { color: #39d353; }
    .log-warn { color: #d29922; }
    .log-error { color: #f85149; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .modal h3 { margin-bottom: 12px; color: #fff; }
    .modal input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      margin-bottom: 16px;
      font-size: 1rem;
      text-align: center;
    }

    .modal button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent-blue);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>JARVIS LIVE OS</h1>
    <p>Multimodal Voice Gateway & Automation Hub</p>
  </header>

  <div class="orb-container">
    <div class="orb" id="voiceOrb" onclick="toggleSession()">
      <span class="orb-label" id="orbLabel">Start</span>
    </div>
  </div>

  <div class="status-panel">
    <div class="status-row">
      <span>Status:</span>
      <span id="connectionBadge" class="badge offline">Getrennt</span>
    </div>
    <div class="status-row">
      <span>Aktives Modell:</span>
      <span style="font-family: monospace; font-size: 0.8rem; color: #58a6ff;">gemini-2.5-flash-native-audio-latest</span>
    </div>
    <div class="log-box" id="logBox">
      <div class="log-entry log-info">[JARVIS OS bereit. Tippe auf den Orb zum Starten.]</div>
    </div>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h3>Sicherheitsschlüssel erforderlich</h3>
      <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 15px;">Gib dein <code>JARVIS_WEBAPP_SECRET</code> ein:</p>
      <input type="password" id="secretInput" placeholder="Passwort / PIN">
      <button onclick="saveSecret()">Verbinden</button>
    </div>
  </div>

  <script>
    // ==============================================================================
    // KONFIGURATION & STATE
    // ==============================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCSU3wEc2qwIoBsL3xtHT_TD58bSNja_wEm_QyWmiD2_yiWNOqBikAbxIia0M2S42TmA/exec";
    const LIVE_API_HOST = "generativelanguage.googleapis.com";
    const MODEL = "models/gemini-2.5-flash-native-audio-latest";

    let authToken = localStorage.getItem("JARVIS_WEBAPP_SECRET") || "";
    let geminiApiKey = "";
    let isConnected = false;
    let websocket = null;
    let inputAudioContext = null;
    let outputAudioContext = null;
    let mediaStream = null;
    let processorNode = null;
    let audioOutputQueue = [];
    let isPlayingAudio = false;

    const orb = document.getElementById("voiceOrb");
    const orbLabel = document.getElementById("orbLabel");
    const badge = document.getElementById("connectionBadge");
    const logBox = document.getElementById("logBox");

    // ==============================================================================
    // LOGGING HILFE
    // ==============================================================================
    function log(message, type = "info") {
      const entry = document.createElement("div");
      entry.className = `log-entry log-${type}`;
      entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // ==============================================================================
    // TOOL DECLARATIONS FÜR GEMINI LIVE
    // ==============================================================================
    const SYSTEM_INSTRUCTION = `Du bist JARVIS, der hochentwickelte persönliche KI-Assistent von Hendrik Harm.
Du hast direkten Lesezugriff auf Hendriks Google Kalender, Gmail, Google Drive und Steuerdaten.
Verhalte dich hochpräzise, freundlich, sachlich und auf den Punkt. 
Antworte immer auf Deutsch per Sprache. Nutze deine Tools proaktiv, wenn Hendrik nach E-Mails, Kalenderterminen, Fristen oder Dokumenten fragt.`;

    const FUNCTION_DECLARATIONS = [
      {
        name: "get_upcoming_deadlines",
        description: "Ruft anstehende Kalendertermine und Fristen aus Google Kalender für eine bestimmte Anzahl an Tagen ab.",
        parameters: {
          type: "OBJECT",
          properties: {
            days: { type: "INTEGER", description: "Anzahl der Tage in die Zukunft (Standard 7)" }
          }
        }
      },
      {
        name: "get_recent_emails",
        description: "Ruft ungelesene E-Mails aus dem Gmail-Posteingang von Hendrik Harm ab.",
        parameters: {
          type: "OBJECT",
          properties: {
            limit: { type: "INTEGER", description: "Maximale Anzahl abzurufender E-Mails (Standard 5)" }
          }
        }
      },
      {
        name: "search_documents",
        description: "Durchsucht Google Drive nach Dateinamen oder Stichworten.",
        parameters: {
          type: "OBJECT",
          properties: {
            query: { type: "STRING", description: "Suchbegriff für Drive-Dateien" }
          },
          required: ["query"]
        }
      },
      {
        name: "get_tax_summary",
        description: "Gibt Auswertungen zu Steuern und Handwerkerlohnanteilen (§35a EStG) aus dem Spreadsheet für 2026.",
        parameters: {
          type: "OBJECT",
          properties: {
            category: { type: "STRING", description: "Optionale Kategorie zum Filtern" }
          }
        }
      },
      {
        name: "get_entity_relation",
        description: "Liest Beziehungen, Verträge, Versicherungen oder Stammdaten aus dem Knowledge-Graph-Sheet.",
        parameters: {
          type: "OBJECT",
          properties: {
            entityName: { type: "STRING", description: "Name der Entität (z. B. Person, Bank, Versicherung)" }
          }
        }
      }
    ];

    // ==============================================================================
    // JSONP SCHNITTSTELLE ZUM APPS SCRIPT BACKEND
    // ==============================================================================
    function callAppsScript(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = "cb_" + Math.random().toString(36).substring(7);
        const script = document.createElement("script");
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          if (data && data.error) {
            reject(new Error(data.error));
          } else {
            resolve(data);
          }
        };

        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error("Netzwerkfehler beim Aufruf von Google Apps Script."));
        };

        const encParams = encodeURIComponent(JSON.stringify(params));
        script.src = `${APPS_SCRIPT_URL}?action=${action}&authToken=${encodeURIComponent(authToken)}&params=${encParams}&callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    // ==============================================================================
    // AUTHENTIFIZIERUNG & INITIALISIERUNG
    // ==============================================================================
    async function toggleSession() {
      if (isConnected) {
        disconnectSession();
        return;
      }

      if (!authToken) {
        document.getElementById("authModal").style.display = "flex";
        return;
      }

      await startSession();
    }

    function saveSecret() {
      const val = document.getElementById("secretInput").value.trim();
      if (val) {
        authToken = val;
        localStorage.setItem("JARVIS_WEBAPP_SECRET", authToken);
        document.getElementById("authModal").style.display = "none";
        startSession();
      }
    }

    async function startSession() {
      try {
        log("🔑 Fordere Konfiguration vom Apps Script Gateway an...", "info");
        badge.className = "badge busy";
        badge.innerText = "Verbinde...";

        const config = await callAppsScript("get_config");
        if (!config || !config.apiKey) {
          throw new Error("Konnte keinen gültigen GEMINI_API_KEY aus Apps Script laden.");
        }
        geminiApiKey = config.apiKey.trim();
        log("✅ API-Key erfolgreich autorisiert.", "success");

        await initWebSocket();
      } catch (err) {
        log(`❌ Fehler: ${err.message}`, "error");
        badge.className = "badge offline";
        badge.innerText = "Fehler";
        if (err.message.includes("403") || err.message.includes("Ungültiger")) {
          localStorage.removeItem("JARVIS_WEBAPP_SECRET");
          authToken = "";
          document.getElementById("authModal").style.display = "flex";
        }
      }
    }

    // ==============================================================================
    // WEBSOCKET & AUDIO ENGINE
    // ==============================================================================
    async function initWebSocket() {
      const wsUrl = `wss://${LIVE_API_HOST}/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${geminiApiKey}`;
      websocket = new WebSocket(wsUrl);

      websocket.onopen = async () => {
        log("🔗 WebSocket-Verbindung zu Gemini Live etabliert.", "success");
        sendInitialSetup();
        await startAudioInput();
        isConnected = true;
        badge.className = "badge online";
        badge.innerText = "Bereit";
        orb.className = "orb listening";
        orbLabel.innerText = "Hört zu";
      };

      websocket.onmessage = async (event) => {
        let msg;
        if (event.data instanceof Blob) {
          const text = await event.data.text();
          msg = JSON.parse(text);
        } else {
          msg = JSON.parse(event.data);
        }
        handleServerMessage(msg);
      };

      websocket.onerror = (err) => {
        log("❌ WebSocket-Fehler aufgetreten.", "error");
      };

      websocket.onclose = (e) => {
        log(`🔌 Verbindung getrennt (${e.code}).`, "warn");
        disconnectSession();
      };
    }

    function sendInitialSetup() {
      const setupMsg = {
        setup: {
          model: MODEL,
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: "Puck"
                }
              }
            }
          },
          systemInstruction: {
            parts: [{ text: SYSTEM_INSTRUCTION }]
          },
          tools: [{
            functionDeclarations: FUNCTION_DECLARATIONS
          }]
        }
      };
      websocket.send(JSON.stringify(setupMsg));
    }

    async function handleServerMessage(msg) {
      if (msg.error) {
        log(`🚨 Gemini-Fehler: ${msg.error.message || JSON.stringify(msg.error)}`, "error");
        return;
      }

      // 1. Audio-Ausgabe empfangen
      if (msg.serverContent && msg.serverContent.modelTurn) {
        orb.className = "orb speaking";
        orbLabel.innerText = "Spricht";
        const parts = msg.serverContent.modelTurn.parts || [];
        for (const part of parts) {
          if (part.inlineData && part.inlineData.mimeType && part.inlineData.mimeType.startsWith("audio/pcm")) {
            playAudioChunk(part.inlineData.data);
          }
        }
      }

      if (msg.serverContent && msg.serverContent.turnComplete) {
        if (!isPlayingAudio) {
          orb.className = "orb listening";
          orbLabel.innerText = "Hört zu";
        }
      }

      // 2. Tool Calls verarbeiten
      if (msg.toolCall) {
        orb.className = "orb tool";
        orbLabel.innerText = "Arbeitet";
        badge.className = "badge busy";
        badge.innerText = "Tool aktiv";

        const functionCalls = msg.toolCall.functionCalls || [];
        const responses = [];

        for (const call of functionCalls) {
          log(`⚡ JARVIS führt Tool aus: ${call.name}`, "info");
          try {
            const result = await callAppsScript(call.name, call.args || {});
            log(`📥 Daten geladen für: ${call.name}`, "success");
            responses.push({
              name: call.name,
              id: call.id,
              response: { result: result }
            });
          } catch (err) {
            log(`❌ Tool-Fehler (${call.name}): ${err.message}`, "error");
            responses.push({
              name: call.name,
              id: call.id,
              response: { error: err.message }
            });
          }
        }

        // Antwort an Gemini zurücksenden
        const toolResponseMsg = {
          toolResponse: {
            functionResponses: responses
          }
        };
        websocket.send(JSON.stringify(toolResponseMsg));
        badge.className = "badge online";
        badge.innerText = "Bereit";
      }
    }

    // ==============================================================================
    // AUDIO IN / OUT PIPELINE (PCM 16kHz & 24kHz)
    // ==============================================================================
    async function startAudioInput() {
      inputAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (inputAudioContext.state === 'suspended') {
        await inputAudioContext.resume();
      }

      mediaStream = await navigator.mediaDevices.getUserMedia({ 
        audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true } 
      });
      const source = inputAudioContext.createMediaStreamSource(mediaStream);

      processorNode = inputAudioContext.createScriptProcessor(4096, 1, 1);
      processorNode.onaudioprocess = (e) => {
        if (!isConnected || !websocket || websocket.readyState !== WebSocket.OPEN) return;

        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        const base64Audio = btoa(String.fromCharCode.apply(null, new Uint8Array(pcm16.buffer)));
        const realtimeInputMsg = {
          realtimeInput: {
            mediaChunks: [{
              mimeType: "audio/pcm;rate=16000",
              data: base64Audio
            }]
          }
        };
        websocket.send(JSON.stringify(realtimeInputMsg));
      };

      source.connect(processorNode);
      processorNode.connect(inputAudioContext.destination);
    }

    function initOutputAudio() {
      if (!outputAudioContext) {
        outputAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      }
      if (outputAudioContext.state === 'suspended') {
        outputAudioContext.resume();
      }
    }

    function playAudioChunk(base64Data) {
      initOutputAudio();
      const binaryString = atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const int16Array = new Int16Array(bytes.buffer);
      const float32Array = new Float32Array(int16Array.length);

      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      const audioBuffer = outputAudioContext.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);

      audioOutputQueue.push(audioBuffer);
      if (!isPlayingAudio) {
        playNextInQueue();
      }
    }

    function playNextInQueue() {
      if (audioOutputQueue.length === 0) {
        isPlayingAudio = false;
        orb.className = "orb listening";
        orbLabel.innerText = "Hört zu";
        return;
      }

      isPlayingAudio = true;
      const buffer = audioOutputQueue.shift();
      const source = outputAudioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(outputAudioContext.destination);
      source.onended = () => playNextInQueue();
      source.start();
    }

    function disconnectSession() {
      isConnected = false;
      if (websocket) { try { websocket.close(); } catch(e){} websocket = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (processorNode) { try { processorNode.disconnect(); } catch(e){} processorNode = null; }
      if (inputAudioContext && inputAudioContext.state !== 'closed') { try { inputAudioContext.close(); } catch(e){} inputAudioContext = null; }
      if (outputAudioContext && outputAudioContext.state !== 'closed') { try { outputAudioContext.close(); } catch(e){} outputAudioContext = null; }
      audioOutputQueue = [];
      isPlayingAudio = false;

      orb.className = "orb";
      orbLabel.innerText = "Start";
      badge.className = "badge offline";
      badge.innerText = "Getrennt";
      log("🔴 Sitzung beendet.", "info");
    }
  </script>
</body>
</html>
